name: Publish course day

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Force a specific day number (optional)"
        required: false
        type: string
      dry_run:
        description: "Generate only, do not commit"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: publish-course-day
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      INPUT_DAY: ${{ github.event.inputs.day }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml

      - name: Publish next day
        run: |
          set -e
          ARGS=""
          if [ -n "${INPUT_DAY:-}" ]; then
            ARGS="$ARGS --day ${INPUT_DAY}"
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running with args: ${ARGS:-<none>}"
          python scripts/publish_next_day.py $ARGS
