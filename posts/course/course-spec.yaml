# AI Coding Tools: 14-Day Course Specification
# This file is the source of truth for the daily auto-publisher.
# Each entry describes exactly what one day's post must contain.
# The publisher reads this, finds the next "upcoming" day, and uses the
# spec as the brief for content generation.

course:
  title: "AI Coding Tools: A Practical 14-Day Course"
  start_date: "2026-05-15"
  cadence: "one lesson per day"
  audience: "experienced engineers"
  voice: "vasco fernandes: direct, technical, evidence-driven, no marketing speak, no em dashes"
  required_per_day:
    min_labs: 5
    min_read_minutes: 60
    min_lab_minutes: 30
    must_include:
      - executable code examples
      - failure modes section
      - explicit acceptance criteria per lab
      - vendor-neutral comparison
      - one quantitative measurement the reader produces
    must_avoid:
      - em dashes
      - vendor marketing copy
      - filler phrases ("in today's fast-paced world", "leverage", "robust")
      - claims without sources
      - labs that can be skipped without losing knowledge

days:
  - day: 1
    slug: "the-landscape"
    date: "2026-05-15"
    status: published
    title: "The Landscape: How Modern AI Coding Tools Actually Work"
    theme: "Survey of the seven major tools, three modes (inline, chat, agent), establishing the personal scoring rubric."

  - day: 2
    slug: "responsible-ai"
    date: "2026-05-16"
    status: upcoming
    title: "Responsible AI for Coding Tools: A Network-Audit Approach"
    theme: "Where your code goes, who keeps it, IP exposure, license matching, network audit with packet capture."
    technical_depth_requirements:
      - "Capture actual TLS-decrypted egress from each tool using mitmproxy with a custom CA installed in the OS trust store"
      - "Document the exact API endpoints, request shapes, and headers each tool sends"
      - "Quantify retention windows with measurable evidence rather than reading the privacy policy"
      - "Build a per-tool data-flow diagram precise enough to satisfy a security review"
    labs:
      - "Set up mitmproxy with a self-signed CA and route VS Code through it"
      - "Capture and analyse the request body for a single tab-completion in three tools; classify what it sends"
      - "Probe the public-code-matching feature of each tool with a deliberately copied snippet from a known repo"
      - "Build a per-tool data-flow diagram and write a one-page security memo for fictional CISO review"
      - "Configure a self-hosted alternative (Continue + ollama with deepseek-coder) and verify zero egress with the same audit"

  - day: 3
    slug: "how-completion-works"
    date: "2026-05-17"
    status: upcoming
    title: "How Code Completion Actually Works: Building an FIM Engine from Scratch"
    theme: "Fill-in-the-middle, ghost text rendering, latency budgets, tokenisation, debouncing, cancellation."
    technical_depth_requirements:
      - "Reader implements a working FIM completion server using a small open model (deepseek-coder-1.3b or qwen-coder-1.5b)"
      - "Cover the full latency stack: keystroke → debounce → request → tokenise → prefill → first-token → render"
      - "Discuss FIM token formats across model families and show how they differ"
      - "Build a streaming token renderer that handles partial UTF-8 and ANSI sequences"
    labs:
      - "Stand up deepseek-coder-1.3b-base on llama.cpp and call it with the FIM token format"
      - "Write a 60-line VS Code extension that requests completions with proper FIM framing"
      - "Add 150ms debouncing and request cancellation; measure the keystroke-to-ghost-text time"
      - "Compare FIM completion quality vs. raw next-token completion on the same prefix"
      - "Profile prefill vs. decode time; report the ratio and discuss what it means for completion-tool architecture"

  - day: 4
    slug: "context-strategies"
    date: "2026-05-18"
    status: upcoming
    title: "Context: What the Model Actually Sees, and How to Control It"
    theme: "@-mentions, file context, repo-grep, tree-sitter context, embedding retrieval, agentic search; A/B testing context strategies."
    technical_depth_requirements:
      - "Show the actual prompts that Cursor, Copilot, Claude Code build, with as much fidelity as can be reverse-engineered"
      - "Compare retrieval strategies (full-file dump, grep-based, embedding-based, agentic) on the same task"
      - "Quantify context budget burn per strategy using token counts"
      - "Discuss the long-context degradation curve and why dumping the whole repo is wrong"
    labs:
      - "Capture the request body of one Cursor chat call using mitmproxy and dissect what context was sent"
      - "Build a retrieval comparator that runs the same query through (full-file, grep, embed, embed+rerank) and measures answer quality"
      - "Construct an adversarial example where embedding retrieval beats grep, and one where grep beats embedding"
      - "Measure how answer quality degrades as you push past 32k tokens of context on the same model"
      - "Write a CLAUDE.md that materially improves multi-turn context handling on your repo"

  - day: 5
    slug: "prompt-engineering"
    date: "2026-05-19"
    status: upcoming
    title: "Prompt Engineering for Code: A/B Testing the Patterns That Work"
    theme: "Specificity, examples, output formats, XML vs. Markdown vs. JSON, role-play, chain-of-thought for code."
    technical_depth_requirements:
      - "Empirical comparison of prompt formats with measured pass-rates on a held-out task set"
      - "Cover constraint enforcement (output schemas, JSON mode, structured outputs)"
      - "Discuss prompt-injection through retrieved code and how to mitigate"
    labs:
      - "Build a 20-task evaluation set drawn from your own historical PRs"
      - "Run the same task through 5 prompt variants and score with a rubric"
      - "Engineer an output schema that the model must conform to; measure schema-violation rate"
      - "Construct a prompt-injection attack via a docstring; demonstrate the failure and fix it"
      - "Write a reusable prompt template library for your three most common code tasks"

  - day: 6
    slug: "system-prompts-and-instructions"
    date: "2026-05-20"
    status: upcoming
    title: "System Prompts and Custom Instructions: Engineering the Spine"
    theme: "CLAUDE.md, .cursorrules, .github/copilot-instructions.md, project-level vs. user-level vs. repo-level."
    technical_depth_requirements:
      - "Cover precedence and scope rules across tools"
      - "Empirically measure when instructions are followed vs. ignored (long-context decay)"
      - "Pattern library: how to instruct vs. how to demonstrate"
    labs:
      - "Diagnose three recurring failures in your repo and write instructions that fix them"
      - "Measure instruction adherence with and without the file present using a 20-task harness"
      - "Build a multi-file instruction structure (root + per-subdir overrides) and verify scope"
      - "Reverse-engineer one open-source CLAUDE.md from a serious project; explain each line"
      - "Write a project-level prompt that survives the long-context degradation curve at 64k tokens"

  - day: 7
    slug: "code-generation-patterns"
    date: "2026-05-21"
    status: upcoming
    title: "Code Generation Patterns: From Boilerplate to End-to-End Features"
    theme: "Scaffolding, boilerplate, idiomatic code, end-to-end CRUD with persistence and tests; same task, three tools."
    technical_depth_requirements:
      - "Show the diffs from three tools side-by-side on the same brief"
      - "Quantify code volume, test coverage, and idiomaticity for each"
      - "Cover the failure modes of each generation pattern"
    labs:
      - "Generate a CRUD API with persistence and tests in three tools; review diffs"
      - "Score the generated code on a 6-axis rubric (correctness, idiomaticity, test quality, error handling, security, performance)"
      - "Build a scaffolding template prompt that produces consistent output across three runs (low temperature)"
      - "Generate the same feature with and without examples in the prompt; measure quality delta"
      - "Identify and document the three failure modes you saw most often"

  - day: 8
    slug: "refactoring"
    date: "2026-05-22"
    status: upcoming
    title: "Refactoring with AI, Safely: The Test-First Pattern"
    theme: "Small steps, test-first refactoring, golden-master testing, where AI breaks at scale."
    technical_depth_requirements:
      - "Cover the safety contract: tests must pass before, between, and after each step"
      - "Show how to use approval testing as a refactoring net"
      - "Discuss multi-file rename hazards and how AI tools mishandle them"
    labs:
      - "Pick a 500-line function in your repo; build a golden-master approval test before any AI touches it"
      - "Refactor in five small AI-assisted steps; verify the golden-master at each step"
      - "Attempt the same refactor in one big-bang AI step; document where it goes wrong"
      - "Rename a class used in 30+ places using each tool; measure correctness of references"
      - "Write a refactoring prompt template that enforces the small-steps discipline"

  - day: 9
    slug: "debugging"
    date: "2026-05-23"
    status: upcoming
    title: "Debugging with AI: Stack Traces, Bisects, and the Five-Whys Pattern"
    theme: "Stack trace reasoning, root-cause-first debugging, git bisect with AI, the 'show me what changed' pattern."
    technical_depth_requirements:
      - "Cover the model's failure modes when reasoning about runtime state vs. static code"
      - "Show how to give the model the right evidence (logs, repro steps, recent diffs)"
      - "Build a debugging session loop that beats the default 'paste stack trace' approach"
    labs:
      - "Take three real bugs from a public repo's issue tracker; debug each with each tool; score time-to-root-cause"
      - "Build a 'pre-debug brief' template that you fill out before consulting AI"
      - "Use AI to suggest the bisect range, then run the bisect; compare to bisecting blind"
      - "Construct an adversarial bug where AI confidently misdiagnoses; document the failure mode"
      - "Write a debugging prompt that forces the model to ask three clarifying questions before suggesting a fix"

  - day: 10
    slug: "testing"
    date: "2026-05-24"
    status: upcoming
    title: "Testing with AI: Coverage, Edge Cases, and Mutation Testing"
    theme: "Unit test generation, edge case discovery, property-based testing, mutation testing as a quality check on AI tests."
    technical_depth_requirements:
      - "Show that line coverage is misleading; mutation score is the right signal"
      - "Build a workflow where AI generates tests and mutmut/cosmic-ray verifies they catch real bugs"
      - "Cover the 'tests that pass even when the code is wrong' failure mode"
    labs:
      - "Get to 90% line coverage on a target module using AI-generated tests"
      - "Run mutation testing; measure mutation score; identify tests that pass against broken code"
      - "Use AI to generate property-based tests with hypothesis or fast-check; verify edge case discovery"
      - "Write a TDD loop with an agent that produces failing test, then code, then verifies"
      - "Build a test-quality rubric and apply it to 20 AI-generated tests"

  - day: 11
    slug: "agentic-workflows"
    date: "2026-05-25"
    status: upcoming
    title: "Multi-File Edits and Agentic Workflows: When to Let It Run"
    theme: "Plan-then-execute, agent loops, tool use, when to step in, building a small migration agent."
    technical_depth_requirements:
      - "Cover the supervision spectrum (full-auto vs. step-through vs. ask-on-edit)"
      - "Build a migration agent end-to-end with safety rails"
      - "Discuss cost control: token budgets, step caps, escalation triggers"
    labs:
      - "Build a small migration agent (e.g., upgrade a project from Pydantic v1 to v2) using one of: Aider, Claude Code, Cursor Agent"
      - "Implement a step cap and a token budget; measure how often each triggers"
      - "Configure ask-on-edit for changes touching critical files (defined by glob); verify it triggers"
      - "Run the same migration with three supervision settings; score correctness vs. wall time"
      - "Write a checklist for 'is this task safe to leave running unattended for 30 minutes?'"

  - day: 12
    slug: "code-review"
    date: "2026-05-26"
    status: upcoming
    title: "Code Review with AI: Diff, Security, and Style as Three Different Jobs"
    theme: "AI as primary reviewer vs. AI as second reviewer, security review patterns, style/lint vs. design review."
    technical_depth_requirements:
      - "Cover the failure modes of AI reviewers (false positives, missing concurrency bugs, style nits over substance)"
      - "Show how to constrain reviews to specific dimensions"
      - "Quantify agreement/disagreement with human reviewers on a curated PR set"
    labs:
      - "Take 5 historical PRs from your repo; have AI review them; compare to the human review of record"
      - "Build a security-only review prompt; measure precision/recall on a known-vulnerable PR set"
      - "Build a design-only review prompt that explicitly suppresses style nits; measure depth of insight"
      - "Configure a CI step that runs AI review on every PR and posts a summary comment"
      - "Document three categories of review where AI is currently worse than a junior reviewer"

  - day: 13
    slug: "evaluation"
    date: "2026-05-27"
    status: upcoming
    title: "Evaluating AI Coding Tools: Build Your Own Eval Harness"
    theme: "SWE-bench, HumanEval, custom evals, why public benchmarks lie, building an eval that matches your work."
    technical_depth_requirements:
      - "Cover the gap between benchmark performance and on-the-job performance"
      - "Show how to construct a 20-task eval drawn from your own commit history"
      - "Build an LLM-as-judge harness with calibration against human scores"
    labs:
      - "Mine 20 representative tasks from your last 6 months of commits; build an eval set"
      - "Implement an LLM-as-judge scoring pipeline; calibrate against your own scores on 5 tasks"
      - "Run three tools through the eval; produce a comparison table that you would defend in a vendor meeting"
      - "Identify which evaluation axes were noisy; refine the rubric and re-run"
      - "Write a one-page report you would send to your team to justify a tool change"

  - day: 14
    slug: "production-patterns"
    date: "2026-05-28"
    status: upcoming
    title: "Production Patterns and Anti-Patterns: Capstone"
    theme: "When to use, when not to, the architecture of teams that ship more, capstone measurement."
    technical_depth_requirements:
      - "Cover the five anti-patterns I see most often in teams 'using AI'"
      - "Discuss the workflow changes that distinguish teams that get value from teams that do not"
      - "Capstone: a measured productivity baseline over one work week"
    labs:
      - "Instrument your week: log every AI interaction, every accept/reject, every wall-clock minute saved or lost"
      - "Compute your accept-rate, time-to-first-useful-suggestion, and rework-rate"
      - "Identify your three highest-leverage AI tasks and your three lowest-leverage ones"
      - "Re-score the rubric you wrote on Day 1; compare initial vs. informed scores"
      - "Write a personal manifesto: 'how I will use AI coding tools for the next 6 months', based on your data"
